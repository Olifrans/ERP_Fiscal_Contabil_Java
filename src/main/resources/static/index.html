<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ERP Fiscal Contábil</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav class="sidebar">
  <div class="brand"><i class="bi bi-bank"></i> ERP Fiscal</div>
  <ul class="nav flex-column">
    <li><a data-tab="dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
    <li><a data-tab="empresas"><i class="bi bi-building"></i> Empresas</a></li>
    <li><a data-tab="plano"><i class="bi bi-diagram-3"></i> Plano de Contas</a></li>
    <li><a data-tab="lancamentos"><i class="bi bi-journal-text"></i> Lançamentos</a></li>
    <li><a data-tab="nf"><i class="bi bi-receipt"></i> Notas Fiscais</a></li>
    <li><a data-tab="fiscal"><i class="bi bi-calculator"></i> Apuração Fiscal</a></li>
    <li><a data-tab="dre"><i class="bi bi-graph-up"></i> DRE</a></li>
  </ul>
</nav>

<main class="content">
  <header class="topbar">
    <h4 id="pageTitle">Dashboard</h4>
    <div>
      <select id="selEmpresa" class="form-select form-select-sm d-inline-block w-auto"></select>
      <input type="date" id="dtIni" class="form-control form-control-sm d-inline-block w-auto">
      <input type="date" id="dtFim" class="form-control form-control-sm d-inline-block w-auto">
    </div>
  </header>

  <section id="tab-dashboard" class="tab"></section>
  <section id="tab-empresas" class="tab d-none"></section>
  <section id="tab-plano" class="tab d-none"></section>
  <section id="tab-lancamentos" class="tab d-none"></section>
  <section id="tab-nf" class="tab d-none"></section>
  <section id="tab-fiscal" class="tab d-none"></section>
  <section id="tab-dre" class="tab d-none"></section>
</main>

<script src="js/app.js"></script>
</body>
</html>
