<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ERP Fiscal Contábil</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="./style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav class="sidebar">
  <div class="brand"><i class="bi bi-bank2"></i> ERP Fiscal</div>
  <div class="user-info" id="userInfo"></div>
  <ul class="nav flex-column">
    <li><a data-tab="dashboard" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
    <li><a data-tab="empresas"><i class="bi bi-building"></i> Empresas</a></li>
    <li><a data-tab="usuarios"><i class="bi bi-people"></i> Usuários</a></li>
    <li><a data-tab="plano"><i class="bi bi-diagram-3"></i> Plano de Contas</a></li>
    <li><a data-tab="lancamentos"><i class="bi bi-journal-text"></i> Lançamentos</a></li>
    <li><a data-tab="nf"><i class="bi bi-receipt"></i> Notas Fiscais</a></li>
    <li><a data-tab="fiscal"><i class="bi bi-calculator"></i> Apuração Fiscal</a></li>
    <li><a data-tab="dre"><i class="bi bi-graph-up"></i> DRE</a></li>
    <li><a data-tab="razao"><i class="bi bi-book"></i> Livro Razão</a></li>
    <li><a data-tab="balancete"><i class="bi bi-table"></i> Balancete</a></li>
    <li><a data-tab="fechamento"><i class="bi bi-calendar-check"></i> Fechamento Mensal</a></li>
    <li><a data-tab="sped"><i class="bi bi-file-earmark-text"></i> SPED Fiscal</a></li>
    <li><a data-tab="nfe"><i class="bi bi-file-earmark-code"></i> NF-e</a></li>
    <li><a data-tab="auditoria"><i class="bi bi-shield-check"></i> Auditoria</a></li>
    <li class="mt-auto"><a onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</a></li>
  </ul>
</nav>

<main class="content">
  <header class="topbar">
    <h4 id="pageTitle">Dashboard</h4>
    <div class="filtros">
      <input type="date" id="dtIni" class="form-control form-control-sm">
      <input type="date" id="dtFim" class="form-control form-control-sm">
      <button class="btn btn-sm btn-primary" onclick="refresh()"><i class="bi bi-arrow-clockwise"></i></button>
    </div>
  </header>

  <section id="tab-dashboard" class="tab"></section>
  <section id="tab-empresas" class="tab d-none"></section>
  <section id="tab-usuarios" class="tab d-none"></section>
  <section id="tab-plano" class="tab d-none"></section>
  <section id="tab-lancamentos" class="tab d-none"></section>
  <section id="tab-nf" class="tab d-none"></section>
  <section id="tab-fiscal" class="tab d-none"></section>
  <section id="tab-dre" class="tab d-none"></section>
  <section id="tab-razao" class="tab d-none"></section>
  <section id="tab-balancete" class="tab d-none"></section>
  <section id="tab-fechamento" class="tab d-none"></section>
  <section id="tab-sped" class="tab d-none"></section>
  <section id="tab-nfe" class="tab d-none"></section>
  <section id="tab-auditoria" class="tab d-none"></section>
</main>

<script src="./script.js"></script>
</body>
</html>
