spring.application.name=escola


# ============================================
# INFORMAÇÕES DA APLICAÇÃO
# ============================================
spring.application.name=erp-fiscal-contabil

# ============================================
# CONFIGURAÇÕES DO SERVIDOR
# ============================================
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ============================================
# CONFIGURAÇÕES DO BANCO DE DADOS (MySQL)
# ============================================
# Nota: use America/Sao_Paulo para garantir datas fiscais corretas
spring.datasource.url=jdbc:mysql://localhost:3306/erp_fiscal?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Executa scripts schema.sql e data.sql na inicialização
spring.sql.init.mode=always

# ============================================
# SEGURANÇA JWT (Obrigatório para o sistema)
# ============================================
# Altere esta chave em produção! Deve ter pelo menos 256 bits (32 caracteres)
app.jwt.secret=ERP_FISCAL_SUPER_SECRET_KEY_2024_MUDE_ISSO_NA_PRODUCAO_123
# 8 horas em milissegundos
app.jwt.expiration-ms=28800000

# ============================================
# CONFIGURAÇÕES FISCAIS E NF-e
# ============================================
# 35 = São Paulo. Altere conforme a UF da empresa
app.nfe.uf=35
# 1 = Produção, 2 = Homologação (Ambiente de testes da SEFAZ)
app.nfe.ambiente=2
# Caminho para o certificado digital A1 (.pfx ou .p12)
app.nfe.certificado-path=src/main/resources/certs/A1.pfx
# Senha do certificado digital
app.nfe.certificado-senha=123456

# ============================================
# CONFIGURAÇÕES CUSTOMIZADAS DO ERP
# ============================================
erp.config.nome-sistema=ERP Fiscal Contábil Profissional
erp.config.versao=3.0.0
erp.config.ambiente=desenvolvimento

# ============================================
# LOGGING
# ============================================
# Ajuste o pacote abaixo se você renomear "com.senai.escola" para outro nome
logging.level.com.senai.escola=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# SPRINGDOC OPENAPI (SWAGGER UI)
# ============================================
# Acessível em: http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method