spring.application.name=escola

# ===================================================================
# 1. INFORMAÇÕES DA APLICAÇÃO E SERVIDOR
# ===================================================================
spring.application.name=erp-fiscal-contabil
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===================================================================
# 2. BANCO DE DADOS (MySQL)
# ===================================================================
# Fuso horário America/Sao_Paulo é OBRIGATÓRIO para sistemas fiscais
spring.datasource.url=jdbc:mysql://localhost:3306/fiscal_erp?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# 3. JPA / HIBERNATE (CRUCIAL PARA O DATA.SQL FUNCIONAR)
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ⚠️ ESTA LINHA É O SEGREDO: Garante que o Hibernate crie as tabelas 
# ANTES do Spring tentar executar o script data.sql
spring.jpa.defer-datasource-initialization=true

# Força a execução dos scripts data.sql na inicialização
spring.sql.init.mode=always

# ===================================================================
# 4. SEGURANÇA E JWT
# ===================================================================
app.jwt.secret=ERP_FISCAL_SUPER_SECRET_KEY_2024_MUDE_ISSO_NA_PRODUCAO_123
app.jwt.expiration-ms=28800000

# ===================================================================
# 5. CONFIGURAÇÕES FISCAIS E NF-e
# ===================================================================
app.nfe.uf=35
app.nfe.ambiente=2
app.nfe.certificado-path=src/main/resources/certs/A1.pfx
app.nfe.certificado-senha=123456

# ===================================================================
# 6. CONFIGURAÇÕES CUSTOMIZADAS DO ERP
# ===================================================================
erp.config.nome-sistema=ERP Fiscal Contábil Profissional
erp.config.versao=3.0.0
erp.config.ambiente=desenvolvimento

# ===================================================================
# 7. LOGGING
# ===================================================================
logging.level.com.senai.escola=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===================================================================
# 8. SWAGGER / OPENAPI (Documentação da API)
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method