spring.application.name=escola


# ============================================
# CONFIGURA\u00c7\u00d5ES DO SERVIDOR
# ============================================
server.port=8080

# ============================================
# CONFIGURA\u00c7\u00d5ES DO SPRING APPLICATION
# ============================================
spring.application.name=escola

# ============================================
# CONFIGURA\u00c7\u00d5ES DO BANCO DE DADOS (MySQL)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/erp_fiscal?createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# CONFIGURA\u00c7\u00d5ES DO JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================
# CONFIGURATION PROPERTIES CUSTOMIZADA
# ============================================
escola.config.nome-sistema=escola API
escola.config.versao=1.0.0
escola.config.max-alunos-turma=40
escola.config.ambiente=desenvolvimento

# ============================================
# LOGGING
# ============================================
logging.level.com.unipiagte.escola=DEBUG
logging.level.org.hibernate.SQL=DEBUG
